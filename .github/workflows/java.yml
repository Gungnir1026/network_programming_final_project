name: Java checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: ubuntu-latest
            java: '25'
          - os: macos-latest
            java: '17'
          - os: windows-latest
            java: '17'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test on macOS / Linux
        if: runner.os != 'Windows'
        run: sh scripts/test.sh
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
